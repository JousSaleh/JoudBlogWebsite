<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Website</title>
    <link rel="stylesheet" href="Css.css">
</head>

<body>

    <header class="navbar" role="banner">
        <div class="navbar__container">

            <a href="Main.html" class="navbar__brand">
                <img src="logo-Photoroom.png" alt="Website Logo">
            </a>

            <button class="navbar__toggle" id="navbarToggle" aria-label="Toggle navigation" aria-controls="navbarMenu"
                aria-expanded="false">
                <span class="bar"></span>
            </button>

            <nav id="navbarMenu" class="navbar__menu" role="navigation" aria-labelledby="navbarToggle">
                <ul class="navbar__list">

                    <li class="navbar__item">
                        <a href="Main.html" class="navbar__link">Home</a>
                    </li>



                </ul>
            </nav>

        </div>
    </header>

    <!-- ========================================= -->
    <!-- ACCOUNT PAGE -->
    <!-- ========================================= -->
    <main  id="accountPage" class="profile-page">

        <div class="account-container">

            <!-- PROFILE CARD -->
            <section class="profile-card">

                <!-- Cover Image -->
                <div class="cover-image-wrapper" id="coverImageButton">
                    <img id="coverImage" src="/default-cover.jpg" alt="Cover image">
                    <div class="cover-overlay">Change Cover</div>
                </div>

                <input type="file" id="coverImageInput" accept="image/*" hidden>

                <!-- Profile Image -->
                <div class="account-image-section">
                    <div class="profile-image-wrapper" id="profileImageButton">
                        <img id="accountProfileImage" src="/default-profile.png" alt="Profile picture">
                        <div class="image-overlay">Change Photo</div>
                    </div>

                    <input type="file" id="profileImageInput" accept="image/*" hidden>

                </div>

                <div>
                    <h2 id="usernameTitle">name</h2>
                </div>
                <!-- BIO + COLOR -->
                <div class="account-bio-section" id="bioCard">

                    

                    <p id="bioDisplay" class="bio-display">
                        Write something about yourself...
                    </p>
                    <div class="bio-top-row">

                        <button type="button" id="toggleBioEdit" class="edit-btn">
                            Edit
                        </button>
                    </div>

                    <textarea id="bioInput" class="bio-input hidden" maxlength="200"
                        placeholder="Write something about yourself..."></textarea>

                    <div id="editControls" class="edit-controls hidden">
                        <div class="color-picker-row">
                            <label for="themeColorPicker">Choose color:</label>
                            <input type="color" id="themeColorPicker" value="#b8e7f2">
                        </div>

                        <button type="button" id="saveBio" class="save-btn">
                            Save Changes
                        </button>
                    </div>

                    

                </div>

            </section>

            <!-- USER POSTS -->
            <section class="user-posts-section">
                <h3>My Posts</h3>
                <div id="userPosts" class="user-posts-grid"></div>
            </section>

        </div>

    </main>

    <script src="js.js"></script>
</body>

</html>
