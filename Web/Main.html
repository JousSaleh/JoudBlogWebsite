<!DOCTYPE html>
<html lang="en-US">

<head>
    <title>Blog Website</title>

    <link rel="stylesheet" href="Css.css">
</head>

<body>

    <header class="navbar" role="banner">
        <div class="navbar__container">
            <a href="Main.html" class="navbar__brand">
    <img src="logo-Photoroom.png" alt="Website Logo">
</a>
           

            <button class="navbar__toggle" id="navbarToggle" aria-label="Toggle navigation" aria-controls="navbarMenu"
                aria-expanded="false">
                <span class="bar"></span>
            </button>

            <nav id="navbarMenu" class="navbar__menu" role="navigation" aria-labelledby="navbarToggle">
                <ul class="navbar__list">
                    <!-- Added a class for the active link demonstration on desktop -->
                    <li class="navbar__item"><a href="Main.html" class="navbar__link navbar__link--active">Home</a></li>
                    <li class="navbar__item"
            id="accountNavItem"
            style="display: none;">

            <a href="accountPage.html"
               class="navbar__link">
                Account
            </a>

        </li>
                    <li class="navbar__item navbar__item--cta">

    <a
        id="openModalLogin"
        class="navbar__link">
        Login
    </a>

    <a
        id="logoutButton"
        class="navbar__link"
        
        style="display: none;">
        Logout
</a>

</li>
                    
                </ul>
            </nav>
        </div>
    </header>





        <div class="overlay" id="loginModal">

    <div class="modallLogin">

        <button id="closeModalLogin">x</button>

        <h2>Login</h2>

         <form id="loginForm">

        <input class="loginFelids" type="text" id="UsernameL" placeholder="Username">

        <input class="loginFelids" type="password" id="PasswordL" placeholder="Password">

        <button id="LoginSubmit">Login</button>
</form>


        <button id="newAccount">Create a new account</button>
<p id="loginMessage"></p>
    </div>

</div>




<div class="overlay" id="registerModal">

    <div class="modalRegister">

        <button id="closeModalRegister" type="button">
            x
        </button>

        <h2>Create Account</h2>

        <form id="registerForm">

            <input
                class="loginFelids"
                type="text"
                id="firstName"
                placeholder="First Name"
            >

            <input
                class="loginFelids"
                type="text"
                id="secondName"
                placeholder="Second Name"
            >

            <input
                class="loginFelids"
                type="text"
                id="Username"
                placeholder="Username"
            >

            <input
                class="loginFelids"
                type="number"
                id="Age"
                placeholder="Age"
            >

            <input
                class="loginFelids"
                type="email"
                id="email"
                placeholder="Email"
            >

            <input
                class="loginFelids"
                type="password"
                id="password"
                placeholder="Password"
            >

            <div>

                <input
                    type="radio"
                    name="Gender"
                    value="Female"
                    id="female"
                >

                <label for="female">
                    Female
                </label>


                <input
                    type="radio"
                    name="Gender"
                    value="Male"
                    id="male"
                >

                <label for="male">
                    Male
                </label>

            </div>


            <button
                id="submitR"
                type="submit"
            >
                Create Account
            </button>

            <p id="message"></p>

        </form>

    </div>

</div>












<main class="homepage">

<div class="homepage-container">

<button id="openCreatePost" class="createPostButton">
    +
</button>

<div id="createPostModal" class="postModal">

    <div class="createPostBox">

        <button
            type="button"
            id="closeCreatePost"
            class="closePostModal">
            ×
        </button>

        <h2>Create Post</h2>
<form id="postForm" enctype="multipart/form-data">

    <input
        type="text"
        id="title"
        name="title"
        placeholder="Post title"
        required
    >

    <textarea
        id="contents"
        name="contents"
        placeholder="Write your post..."
        required
    ></textarea>

    <input
        type="file"
        id="contentPhotos"
        name="contentPhotos"
        accept="image/*"
        multiple
    >


            <button type="submit" class="publishButton">
                Publish Post
            </button>

        </form>

    </div>

</div>




<div id="postsContainer">

</div>


<div id="imageModal" class="image-modal">

    <span id="closeImageModal" class="close-image-modal">
        &times;
    </span>

    <img id="expandedImage" class="expanded-image">

</div>


</div>


</main>



    <script src="js.js"></script>
</body>

</html>
